name: Build & Release Mic APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit & Smoke Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Distribution
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/Mic-Karaoke-v1.0.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mic-Karaoke-Release-APK
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 > /dev/null 2>&1; then
            echo "Release v1.0.0 exists. Uploading APK assets..."
            gh release upload v1.0.0 release-artifacts/Mic-Karaoke-v1.0.0.apk release-artifacts/app-release.apk --clobber
          else
            echo "Creating Release v1.0.0..."
            gh release create v1.0.0 \
              --title "Mic v1.0.0 — Real-Time Karaoke Microphone" \
              --notes "### 🎙️ Mic — Real-Time Karaoke Microphone App for JBL Charge 6

          Download **Mic-Karaoke-v1.0.0.apk** below and install it directly on your phone!

          - **Real-Time Vocal Routing:** Ultra-low latency DSP engine (<5ms).
          - **Concurrent Background Mixing:** Mixes with Spotify, YouTube & Apple Music without ducking.
          - **Karaoke Effects:** Preamp Volume Boost, Circular Echo, and Concert-Hall Reverb.
          - **Acoustic Safety:** Anti-Howling protective ducking & Bluetooth disconnect auto-mute." \
              release-artifacts/Mic-Karaoke-v1.0.0.apk \
              release-artifacts/app-release.apk
          fi
