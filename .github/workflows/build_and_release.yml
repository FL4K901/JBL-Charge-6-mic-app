name: Build & Release Mic APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit & Smoke Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Distribution
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v1.0.1"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/Mic-Karaoke-v1.0.1.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/Mic-Karaoke-${TAG}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mic-Karaoke-Release-APK
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG:-v1.0.1}"
          echo "Target Release Tag: $TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists. Uploading APK assets..."
            gh release upload "$TAG" release-artifacts/*.apk --clobber
          else
            echo "Creating Release $TAG..."
            gh release create "$TAG" \
              --title "Mic $TAG — Real-Time Karaoke Microphone (Google Oboe Engine)" \
              --notes "### 🎙️ Mic $TAG — Real-Time Karaoke Microphone App

          Download **Mic-Karaoke-v1.0.1.apk** below and install it directly on your phone!

          #### 🚀 What's New in v1.0.1:
          - **Google Oboe C++ Engine:** Native AAudio engine cutting software latency to 8–16ms.
          - **Independent Mic Boost Slider:** 1.0x to 5.0x (+14 dB) independent software vocal preamp.
          - **Limiter & Hard-Clipper:** Soft-knee compression + brickwall limiter preventing digital clipping.
          - **Background Audio Ducking:** Automatically ducks Spotify, YouTube, and Apple Music volume by ~30% when Mic is live, and restores to 100% on stop." \
              release-artifacts/*.apk
          fi
